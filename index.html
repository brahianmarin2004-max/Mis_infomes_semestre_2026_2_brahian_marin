<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Entregas Programación - Bio-Python</title>
<style>
:root {
  --bg: #0f1115;
  --sidebar-bg: #161923;
  --sidebar-border: #262b3a;
  --accent: #6c8cff;
  --accent-soft: rgba(108, 140, 255, 0.15);
  --text: #e6e8ef;
  --text-dim: #8b90a3;
  --card-bg: #1b1f2b;
  --card-border: #2a2f40;
}
 
* {
  box-sizing: border-box;
}
 
html, body {
  margin: 0;
  padding: 0;
  height: 100%;
}
 
body {
  font-family: "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
  background: var(--bg);
  color: var(--text);
}
 
.app {
  display: flex;
  height: 100vh;
  overflow: hidden;
}
 
.sidebar {
  width: 260px;
  flex-shrink: 0;
  background: var(--sidebar-bg);
  border-right: 1px solid var(--sidebar-border);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
}
 
.sidebar-title {
  font-size: 1.05rem;
  line-height: 1.35;
  font-weight: 600;
  color: var(--text);
  padding: 24px 20px 16px;
  margin: 0;
  border-bottom: 1px solid var(--sidebar-border);
}
 
.sidebar-title span {
  color: var(--accent);
  font-weight: 700;
}
 
.tabs {
  display: flex;
  flex-direction: column;
  padding: 10px;
  gap: 2px;
}
 
.tab-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 10px 14px;
  border: none;
  background: transparent;
  color: var(--text-dim);
  font-size: 0.92rem;
  text-align: left;
  border-radius: 8px;
  cursor: pointer;
  transition: background 0.15s ease, color 0.15s ease;
}
 
.tab-btn:hover {
  background: rgba(255, 255, 255, 0.04);
  color: var(--text);
}
 
.tab-btn.active {
  background: var(--accent-soft);
  color: var(--accent);
  font-weight: 600;
}
 
.tab-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
 
.tab-btn:disabled:hover {
  background: transparent;
  color: var(--text-dim);
}
 
.tab-num {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: rgba(255, 255, 255, 0.06);
  font-size: 0.75rem;
  flex-shrink: 0;
}
 
.tab-btn.active .tab-num {
  background: var(--accent);
  color: #0f1115;
}
 
.content {
  flex: 1;
  overflow-y: auto;
  padding: 32px 40px;
}
 
.panel {
  display: none;
  height: 100%;
  flex-direction: column;
}
 
.panel.active {
  display: flex;
}
 
.panel-header {
  margin-bottom: 20px;
}
 
.panel-header h2 {
  margin: 0 0 6px;
  font-size: 1.4rem;
}
 
.panel-header p {
  margin: 0;
  color: var(--text-dim);
  font-size: 0.9rem;
}
 
.pdf-wrapper {
  flex: 1;
  border-radius: 12px;
  overflow: hidden;
  border: 1px solid var(--card-border);
  background: #20232e;
  min-height: 0;
}
 
.pdf-wrapper embed,
.pdf-wrapper iframe,
.pdf-wrapper object {
  width: 100%;
  height: 100%;
  border: none;
  display: block;
}
 
.pdf-fallback {
  padding: 20px;
  color: var(--text-dim);
  font-size: 0.9rem;
}
 
.pdf-fallback a {
  color: var(--accent);
}
 
.empty-card {
  flex: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 1px dashed var(--card-border);
  border-radius: 12px;
  background: var(--card-bg);
  color: var(--text-dim);
  font-size: 0.95rem;
  text-align: center;
  padding: 40px;
}

/* Estilos para la tarjeta de introducción */
.intro-card {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  border-radius: 12px;
  background: var(--card-bg);
  border: 1px solid var(--card-border);
  padding: 40px;
  text-align: center;
}

.intro-avatar {
  font-size: 5rem;
  line-height: 1;
  margin-bottom: 1rem;
  background: var(--accent-soft);
  width: 120px;
  height: 120px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 3px solid var(--accent);
}

.intro-name {
  font-size: 1.8rem;
  font-weight: 600;
  margin: 0.5rem 0 0.25rem;
}

.intro-detail {
  font-size: 1.1rem;
  color: var(--text-dim);
  margin: 0.2rem 0;
}
</style>
</head>
<body>
  <div class="app">
    <aside class="sidebar">
      <h1 class="sidebar-title">Entregas Programación<br><span>Bio-Python</span></h1>
      <nav class="tabs" id="tabs"></nav>
    </aside>
 
    <main class="content" id="content"></main>
  </div>
 
  <script>
    const TOTAL_ENTREGAS = 17;
 
    const tabsEl = document.getElementById("tabs");
    const contentEl = document.getElementById("content");
 
    const pdfName = (n) => `EntregaSemana_${n}.pdf`;
 
    function buildTabs() {
      // Botón de introducción (siempre habilitado)
      const introBtn = document.createElement("button");
      introBtn.className = "tab-btn active"; // se activará por defecto más adelante
      introBtn.dataset.tab = "intro";
      introBtn.innerHTML = `<span class="tab-num">🐢</span> Introducción`;
      introBtn.addEventListener("click", () => activateTab("intro"));
      tabsEl.appendChild(introBtn);
 
      // Botones de semanas
      for (let i = 1; i <= TOTAL_ENTREGAS; i++) {
        const btn = document.createElement("button");
        btn.className = "tab-btn";
        btn.dataset.tab = i;
        btn.disabled = true; // se habilita solo si existe su PDF
        btn.innerHTML = `<span class="tab-num">${i}</span> Semana ${i}`;
        btn.addEventListener("click", () => activateTab(i));
        tabsEl.appendChild(btn);
      }
    }
 
    function buildPanels() {
      // Panel de introducción
      const introPanel = document.createElement("section");
      introPanel.className = "panel active"; // activo por defecto
      introPanel.id = "panel-intro";
      introPanel.innerHTML = `
        <div class="panel-header">
          <h2>Introducción</h2>
          <p>Datos del estudiante</p>
        </div>
        <div class="intro-card">
          <div class="intro-avatar">🐢</div>
          <div class="intro-name">🐢 Brahian Marín Giraldo 🐢</div>
          <div class="intro-detail">🐢 Biología 2026-2 🐢</div>
          <div class="intro-detail">🐢 Universidad CES 🐢</div>
        </div>
      `;
      contentEl.appendChild(introPanel);
 
      // Paneles de semanas
      for (let i = 1; i <= TOTAL_ENTREGAS; i++) {
        const panel = document.createElement("section");
        panel.className = "panel";
        panel.id = `panel-${i}`;
        panel.innerHTML = `
          <div class="panel-header">
            <h2>Semana ${i}</h2>
            <p>Contenido pendiente por agregar</p>
          </div>
          <div class="empty-card">Aún no se ha añadido el archivo "${pdfName(i)}" para esta semana.</div>
        `;
        contentEl.appendChild(panel);
      }
    }
 
    function renderPdf(n) {
      const name = pdfName(n);
      const panel = document.getElementById(`panel-${n}`);
      panel.innerHTML = `
        <div class="panel-header">
          <h2>Semana ${n}</h2>
          <p>Visualización embebida: ${name}</p>
        </div>
        <div class="pdf-wrapper">
          <embed src="${name}" type="application/pdf" />
        </div>
        <div class="pdf-fallback">
          Si el PDF no se visualiza correctamente, puedes <a href="${name}" target="_blank" rel="noopener">abrirlo en una nueva pestaña</a>.
        </div>
      `;
    }
 
    function enableTab(n) {
      const btn = tabsEl.querySelector(`.tab-btn[data-tab="${n}"]`);
      if (btn) btn.disabled = false;
    }
 
    // Detecta si el archivo existe (funciona también abriendo el HTML con file://)
    function fileExists(url) {
      return new Promise((resolve) => {
        const link = document.createElement("link");
        link.rel = "stylesheet";
        link.href = url;
        link.onload = () => { link.remove(); resolve(true); };
        link.onerror = () => { link.remove(); resolve(false); };
        document.head.appendChild(link);
      });
    }
 
    async function detectPdfs() {
      const found = [];
      await Promise.all(
        Array.from({ length: TOTAL_ENTREGAS }, async (_, idx) => {
          const n = idx + 1;
          if (await fileExists(pdfName(n))) {
            renderPdf(n);
            enableTab(n);
            found.push(n);
          }
        })
      );
      return found.sort((a, b) => a - b);
    }
 
    function activateTab(tabId) {
      // Desactivar todos los botones y paneles
      document.querySelectorAll(".tab-btn").forEach((btn) => {
        btn.classList.remove("active");
      });
      document.querySelectorAll(".panel").forEach((panel) => {
        panel.classList.remove("active");
      });
 
      // Activar el botón y panel correspondiente
      const btn = tabsEl.querySelector(`.tab-btn[data-tab="${tabId}"]`);
      if (btn) btn.classList.add("active");
 
      const panelId = tabId === "intro" ? "panel-intro" : `panel-${tabId}`;
      const panel = document.getElementById(panelId);
      if (panel) panel.classList.add("active");
 
      // Actualizar hash
      window.location.hash = tabId === "intro" ? "intro" : `semana-${tabId}`;
    }
 
    async function init() {
      buildTabs();
      buildPanels();
 
      const found = await detectPdfs();
 
      const hash = window.location.hash.slice(1); // quita el #
      let initialTab;
 
      if (hash === "intro") {
        initialTab = "intro";
      } else if (hash.startsWith("semana-")) {
        const num = Number(hash.split("-")[1]);
        if (found.includes(num)) {
          initialTab = num;
        } else {
          initialTab = "intro";
        }
      } else {
        // Si no hay hash o no coincide, mostrar introducción
        initialTab = "intro";
      }
 
      activateTab(initialTab);
    }
 
    init();
  </script>
</body>
</html>
